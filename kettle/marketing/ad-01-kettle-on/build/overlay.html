<!doctype html>
<!-- Edit-layer graphics for ad 01, rendered with the app's own styles, fonts and art components.
     Served by the Kettle Vite dev server: /marketing/ad-01-kettle-on/build/overlay.html?mode=… -->
<html data-theme="dark">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent !important; overflow: hidden !important; scrollbar-gutter: auto !important; }
  #root { width: 1080px; height: 1920px; position: relative; }
  .band { position: absolute; left: 90px; right: 120px; top: 250px; height: 220px; display: grid; place-items: center; }
  .pill { font-family: var(--font-display); font-weight: 700; font-size: 74px; line-height: 1.08; letter-spacing: -0.5px;
          color: #fff9f0; text-align: center; padding: 26px 44px 30px; border-radius: 40px;
          background: rgba(36, 26, 45, 0.84); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
  .pill em { font-style: normal; color: #ffc23d; }
  .time { position: absolute; inset: 0; display: grid; place-items: center; background: #241a2d; }
  .time div { font-family: var(--font-display); font-weight: 700; font-size: 104px; color: #fff9f0; text-align: center; line-height: 1.05; }
  .time small { display: block; margin-top: 24px; font-size: 44px; font-weight: 600; color: #b39af0; }
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 760px; background: linear-gradient(#241a2dcc, #241a2d66 55%, transparent); }
  .ripple { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
            border: 7px solid rgba(255, 249, 240, 0.9); background: rgba(255, 249, 240, 0.25); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./overlay.tsx"></script>
</body>
</html>
