<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9f0" />
    <script>
      /* Theme before first paint (design-system; mirrors src/app/theme.ts). */
      (function () {
        try {
          var st = (JSON.parse(localStorage.getItem('kettle:settings') || '{}').state || {});
          var q = new URLSearchParams(location.search).get('theme');
          var p = q === 'light' || q === 'dark' ? q : st.theme || 'auto';
          var dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#241a2d' : '#fff9f0');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Kettle — a cozy focus timer. Put the kettle on, get cozy, get it done." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Kettle — cozy focus timer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
