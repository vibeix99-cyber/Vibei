<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0d14" />
<title>Grand Line Arena — Tactical Fighter Battles</title>
<meta name="description" content="A tactical turn-based PvP fighter battler in the Pokémon lineage, cast with anime fighters." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
<link rel="stylesheet" href="./src/ui/theme.css" />
<style>
  #boot{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:#05060a; z-index:99; transition:opacity .5s ease;
    font-family:'Trebuchet MS',system-ui,sans-serif; color:#f2c94c;
  }
  #boot.gone{ opacity:0; pointer-events:none; }
  #boot .m{ font-size:clamp(20px,4vw,42px); font-weight:900; letter-spacing:.3em; }
  #boot .bar{ width:min(280px,60vw); height:6px; background:#1b2033; border-radius:99px; overflow:hidden; }
  #boot .bar i{ display:block; height:100%; width:30%; background:#f2c94c; animation:sweep 1.1s infinite ease-in-out; }
  @keyframes sweep{ 0%{ transform:translateX(-110%) } 100%{ transform:translateX(360%) } }
  #boot .err{ color:#ff8a8a; font-size:13px; max-width:80vw; text-align:center; white-space:pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/webgpu": "./vendor/three/three.webgpu.js",
    "three/tsl": "./vendor/three/three.tsl.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="ui"></div>
</div>
<div id="boot"><div class="m">GRAND LINE</div><div class="bar"><i></i></div><div class="err" id="booterr"></div></div>
<script type="module">
  window.addEventListener('error', (e) => {
    const el = document.getElementById('booterr');
    if (el) el.textContent = (e.error?.stack || e.message || String(e)).slice(0, 600);
    window.__ARENA_ERROR = e.error?.stack || e.message;
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('booterr');
    if (el) el.textContent = String(e.reason?.stack || e.reason).slice(0, 600);
    window.__ARENA_ERROR = String(e.reason?.stack || e.reason);
  });
  import('./src/main.js').then(async () => {
    await window.__ARENA.ready;
    document.getElementById('boot').classList.add('gone');
    setTimeout(() => document.getElementById('boot')?.remove(), 600);
  }).catch((err) => {
    const el = document.getElementById('booterr');
    if (el) el.textContent = (err?.stack || String(err)).slice(0, 800);
    window.__ARENA_ERROR = err?.stack || String(err);
  });
</script>
</body>
</html>
