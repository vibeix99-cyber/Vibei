<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PERIHELION — Gravity is your engine.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

  :root{
    --abyss:#070914;

  html,body{
    width:100%;height:100%;overflow:hidden;background:#070914;

  #stage{display:block;width:100vw;height:100vh;cursor:crosshair;}
  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070914;color:var(--starlight);z-index:50;

  #loader.hidden{opacity:0;pointer-events:none;}

<body>
<canvas id="stage"></canvas>
<div id="loader"><span class="lp">calibrating optics…</span></div>
<script>
"use strict";
/* =========================================================================
   PERIHELION — a gravity-slingshot arcade survival game
   Vanilla JS · Canvas 2D · WebAudio. Single file. All visuals procedural.
   ========================================================================= */

/* ----------------------------- Palette / Tokens -------------------------- */
const COL = {
  abyss:    '#070914',
  indigo:   '#2B2E6B',
  cyan:     '#59E3FF',
  coral:    '#FF6B4A',
  gold:     '#FFD166',
  starlight:'#EAF2FF',
};
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a + (b-a)*t;
const rand  = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> (a + Math.random()*(b-a))|0;
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const smooth= (t)=> t*t*(3-2*t);
function hexToRgb(h){h=h.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function rgba(hex,a){const c=hexToRgb(hex);return `rgba(${c.r},${c.g},${c.b},${a})`;}
function mixHex(h1,h2,t){const a=hexToRgb(h1),b=hexToRgb(h2);
  const r=Math.round(lerp(a.r,b.r,t)),g=Math.round(lerp(a.g,b.g,t)),bl=Math.round(lerp(a.b,b.b,t));
  return `rgb(${r},${g},${bl})`;}

/* small deterministic PRNG for seeded world gen */
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* value-noise for plasma / surfaces */
function makeNoise(seed){
  const r = mulberry32(seed);
  const p = new Uint8Array(512);
  const perm = new Uint8Array(256);
  for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<512;i++) p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const grad=(h,x,y)=>{const u=h&1?x:-x;const v=h&2?y:-y;return u+v;};
  return function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const A=p[X]+Y, B=p[X+1]+Y;
    return (lerp(
      lerp(grad(p[A],x,y),   grad(p[B],x-1,y),   u),
      lerp(grad(p[A+1],x,y-1),grad(p[B+1],x-1,y-1),u),
    v)+1)/2;
  };
}

/* ------------------------------- Canvas setup ---------------------------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', {alpha:false});
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width  = Math.floor(VW*DPR);
  canvas.height = Math.floor(VH*DPR);
  canvas.style.width = VW+'px';
  canvas.style.height= VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  UI.scale = clamp(Math.min(VW,VH)/820, 0.72, 1.15);
}
window.addEventListener('resize', resize);

/* ------------------------------- Audio ----------------------------------- */
const Audio = (()=>{
  let actx=null, master=null, muted=false, ambientGain=null, started=false;
  function ensure(){
    if(actx) return;
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = muted?0:0.9;
      master.connect(actx.destination);
    }catch(e){actx=null;}
  }
  function unlock(){
    ensure();
    if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    if(!started){ started=true; startAmbient(); }
  }
  function now(){return actx?actx.currentTime:0;}
  function startAmbient(){
    if(!actx||ambientGain) return;
    ambientGain = actx.createGain();
    ambientGain.gain.value = 0.0;
    ambientGain.connect(master);
    ambientGain.gain.linearRampToValueAtTime(0.10, now()+4);
    // two detuned saw-ish drones through a slow lowpass
    [55, 82.4, 110].forEach((f,i)=>{
      const o=actx.createOscillator();
      o.type = i===2?'sine':'triangle';
      o.frequency.value=f;
      const g=actx.createGain(); g.gain.value= i===2?0.35:0.55;
      const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
      // slow LFO on filter
      const lfo=actx.createOscillator(); lfo.frequency.value=0.04+i*0.017;
      const lfg=actx.createGain(); lfg.gain.value=140;
      lfo.connect(lfg); lfg.connect(lp.frequency); lfo.start();
      o.connect(lp); lp.connect(g); g.connect(ambientGain); o.start();
    });
  }
  function thruster(intensity){
    if(!actx||muted) return;
    const t=now();
    const buf=actx.createBuffer(1, actx.sampleRate*0.18, actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    const src=actx.createBufferSource(); src.buffer=buf;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.7;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.11*intensity, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+0.18);
  }
  const PENT=[0,2,4,7,9,12,14,16]; // pentatonic-ish steps
  function shard(comboStep){
    if(!actx||muted) return;
    const t=now();
    const base=523.25; // C5
    const step=PENT[clamp(comboStep,0,PENT.length-1)];
    const f=base*Math.pow(2, step/12);
    const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.001;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.16, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    const g2=actx.createGain(); g2.gain.value=0.25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t+0.5); o2.stop(t+0.5);
  }
  function perihelion(){
    if(!actx||muted) return;
    const t=now();
    // warm rising fifth + shimmer
    const notes=[[392,0],[587.33,0.09]]; // G4 -> D5
    notes.forEach(([f,dt])=>{
      const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const g=actx.createGain();
      g.gain.setValueAtTime(0.0001,t+dt);
      g.gain.linearRampToValueAtTime(0.18,t+dt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.9);
      o.connect(g); g.connect(master); o.start(t+dt); o.stop(t+dt+0.9);
    });
    // shimmer
    for(let i=0;i<4;i++){
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=1568*Math.pow(2,i/12);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t+0.05+i*0.03);
      g.gain.linearRampToValueAtTime(0.05,t+0.07+i*0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.6+i*0.03);
      o.connect(g); g.connect(master); o.start(t+0.05+i*0.03); o.stop(t+0.7+i*0.03);
    }
  }
  function death(){
    if(!actx||muted) return;
    const t=now();
    // sub drop
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(28,t+1.1);
    const g=actx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+1.4);
    // noise bloom -> lowpass sweep
    const buf=actx.createBuffer(1, actx.sampleRate*0.9, actx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf;
    const lp=actx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(4200,t); lp.frequency.exponentialRampToValueAtTime(180,t+0.8);
    const ng=actx.createGain(); ng.gain.setValueAtTime(0.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    src.connect(lp); lp.connect(ng); ng.connect(master); src.start(t); src.stop(t+0.9);
  }
  function record(){
    if(!actx||muted) return;
    const t=now();
    [659.25,830.61,987.77,1318.5].forEach((f,i)=>{
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.08);
      g.gain.linearRampToValueAtTime(0.12,t+i*0.08+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.6);
      o.connect(g); g.connect(master); o.start(t+i*0.08); o.stop(t+i*0.08+0.6);
    });
  }
  function setMute(m){muted=m; if(master) master.gain.value=m?0:0.9;}
  return {unlock, thruster, shard, perihelion, death, record, setMute,
          get muted(){return muted;}, get ready(){return !!actx;}};
})();

/* ------------------------------- Persistence ----------------------------- */
const Store = {
  bestScore: +(localStorage.getItem('ph_bestScore')||0),
  bestDist:  +(localStorage.getItem('ph_bestDist')||0),
  runs:      +(localStorage.getItem('ph_runs')||0),
  muted:     localStorage.getItem('ph_muted')==='1',
  save(){
    localStorage.setItem('ph_bestScore', this.bestScore|0);
    localStorage.setItem('ph_bestDist', this.bestDist|0);
    localStorage.setItem('ph_runs', this.runs|0);
    localStorage.setItem('ph_muted', this.muted?'1':'0');
  }
};

/* =========================================================================
   PRE-RENDERED GLOW SPRITE
   ========================================================================= */
function makeGlowSprite(size, hex, inner){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d');
  const r=size/2;
  const grd=g.createRadialGradient(r,r,0,r,r,r);
  grd.addColorStop(0, rgba(hex, inner));
  grd.addColorStop(0.4, rgba(hex, inner*0.5));
  grd.addColorStop(1, rgba(hex, 0));
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  return c;
}
const GLOW = {
  cyan: makeGlowSprite(128, COL.cyan, 0.9),
  gold: makeGlowSprite(128, COL.gold, 0.95),
  coral:makeGlowSprite(128, COL.coral,0.9),
  white:makeGlowSprite(128, COL.starlight,1.0),
};
function blitGlow(sprite, x, y, radius, alpha){
  ctx.globalAlpha = alpha;
  ctx.drawImage(sprite, x-radius, y-radius, radius*2, radius*2);
  ctx.globalAlpha = 1;
}

/* =========================================================================
   PLANET RENDERER — pre-render each planet body to offscreen canvas
   Three distinct types: gas giant (banded), rocky (speckle), ice (crisp)
   ========================================================================= */
const PLANET_TYPES = [
  { name:'gas',   core:'#3a2a6b', hi:'#8f6bff', accent:'#b39dff', atmo:'#7c5cff' },
  { name:'gas2',  core:'#5b2a3f', hi:'#ff8a5c', accent:'#ffb37a', atmo:'#ff7a4a' },
  { name:'rocky', core:'#2c2f3d', hi:'#7d8aa8', accent:'#aebbd6', atmo:'#6fa8ff' },
  { name:'ice',   core:'#123a4a', hi:'#7fe9ff', accent:'#c7f6ff', atmo:'#59e3ff' },
  { name:'ember', core:'#4a1520', hi:'#ff5a4a', accent:'#ffd166', atmo:'#ff6b4a' },
];

function renderPlanetBody(radius, typeIdx, seed){
  const T = PLANET_TYPES[typeIdx];
  const pad = radius*0.9;                 // room for atmosphere halo
  const S = Math.ceil((radius+pad)*2);
  const c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  const cx=S/2, cy=S/2;
  const noise = makeNoise(seed);
  // Sun is off-screen to the RIGHT — light comes from the right, up a touch.
  const lightX = 0.42, lightY = -0.22;

  // (3) atmospheric halo — drawn first (behind body), brightest on sun rim
  g.save();
  const halo=g.createRadialGradient(cx,cy,radius*0.7, cx,cy,radius+pad);
  halo.addColorStop(0, rgba(T.atmo,0.0));
  halo.addColorStop(0.55, rgba(T.atmo,0.10));
  halo.addColorStop(0.8, rgba(T.atmo,0.28));
  halo.addColorStop(1, rgba(T.atmo,0));
  g.globalCompositeOperation='lighter';
  g.fillStyle=halo; g.beginPath(); g.arc(cx,cy,radius+pad,0,TAU); g.fill();
  g.restore();

  // clip to disc for the body passes
  g.save();
  g.beginPath(); g.arc(cx,cy,radius,0,TAU); g.clip();

  // (1) base radial gradient offset toward the sun => lit/shadow hemisphere
  const bg=g.createRadialGradient(
    cx+radius*lightX, cy+radius*lightY, radius*0.1,
    cx, cy, radius*1.15);
  bg.addColorStop(0, T.hi);
  bg.addColorStop(0.5, mixHex(T.hi,T.core,0.55));
  bg.addColorStop(1, T.core);
  g.fillStyle=bg; g.fillRect(0,0,S,S);

  // (2) procedural surface pass
  if(T.name.startsWith('gas')){
    // banded gas giant: horizontal turbulent bands
    g.globalCompositeOperation='overlay';
    const bands=randi(7,11);
    for(let i=0;i<bands;i++){
      const ny=i/bands;
      const y = (ny*2-1)*radius;
      const h = radius*2/bands;
      const wobble = noise(i*1.7, seed*0.01)*0.5;
      const shade = (i%2===0)?0.16:-0.14;
      g.fillStyle = shade>0? rgba('#ffffff', shade+wobble*0.1) : rgba('#000000', -shade+wobble*0.1);
      g.save();
      g.translate(cx,cy);
      g.beginPath();
      g.moveTo(-radius, y - h*0.2);
      for(let x=-radius;x<=radius;x+=6){
        const yy = y + Math.sin((x*0.02)+i*2.1)*h*0.18 + (noise(x*0.02+i, i*0.5)-0.5)*h*0.5;
        g.lineTo(x, yy);
      }
      g.lineTo(radius, y+h); g.lineTo(-radius, y+h); g.closePath(); g.fill();
      g.restore();
    }
    // subtle storm swirl
    g.globalCompositeOperation='lighter';
    const sx=cx+rand(-radius*0.3,radius*0.4), sy=cy+rand(-radius*0.2,radius*0.2);
    const sr=radius*rand(0.14,0.26);
    const st=g.createRadialGradient(sx,sy,0,sx,sy,sr);
    st.addColorStop(0, rgba(T.accent,0.5)); st.addColorStop(1, rgba(T.accent,0));
    g.fillStyle=st; g.beginPath(); g.arc(sx,sy,sr,0,TAU); g.fill();
  } else if(T.name==='rocky' || T.name==='ember'){
    // rocky: noise-speckle craters/continents
    g.globalCompositeOperation='overlay';
    const step=Math.max(3, radius/40);
    for(let y=-radius;y<radius;y+=step){
      for(let x=-radius;x<radius;x+=step){
        const n=noise((x+cx)*0.05+seed, (y+cy)*0.05);
        const a=(n-0.5);
        if(Math.abs(a)<0.08) continue;
        g.fillStyle = a>0? rgba('#ffffff', a*0.5): rgba('#05060c', -a*0.6);
        g.fillRect(cx+x, cy+y, step, step);
      }
    }
    // a few crater rings
    g.globalCompositeOperation='source-over';
    for(let i=0;i<6;i++){
      const a=rand(0,TAU), rr=rand(0,radius*0.8);
      const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr, cr=rand(radius*0.05,radius*0.16);
      const cg=g.createRadialGradient(px,py,0,px,py,cr);
      cg.addColorStop(0, rgba('#05060c',0.35)); cg.addColorStop(0.7, rgba('#05060c',0));
      cg.addColorStop(0.85, rgba('#ffffff',0.12)); cg.addColorStop(1, rgba('#ffffff',0));
      g.fillStyle=cg; g.beginPath(); g.arc(px,py,cr,0,TAU); g.fill();
    }
  } else {
    // ice: crisp fractured plates + bright specular
    g.globalCompositeOperation='overlay';
    for(let i=0;i<26;i++){
      const a=rand(0,TAU), rr=rand(0,radius);
      const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
      g.strokeStyle=rgba('#ffffff', rand(0.04,0.14));
      g.lineWidth=rand(0.6,1.6);
      g.beginPath(); g.moveTo(px,py);
      g.lineTo(px+rand(-radius*0.4,radius*0.4), py+rand(-radius*0.4,radius*0.4)); g.stroke();
    }
    g.globalCompositeOperation='lighter';
    const spx=cx+radius*lightX*1.2, spy=cy+radius*lightY*1.2;
    const sp=g.createRadialGradient(spx,spy,0,spx,spy,radius*0.5);
    sp.addColorStop(0, rgba('#ffffff',0.5)); sp.addColorStop(1, rgba('#ffffff',0));
    g.fillStyle=sp; g.beginPath(); g.arc(spx,spy,radius*0.5,0,TAU); g.fill();
  }

  // (4) dark vignette on the shadow limb (opposite the sun)
  g.globalCompositeOperation='source-over';
  const vg=g.createRadialGradient(
    cx-radius*lightX*1.1, cy-radius*lightY*1.1, radius*0.2,
    cx-radius*lightX, cy-radius*lightY, radius*1.5);
  vg.addColorStop(0, rgba('#02030a',0));
  vg.addColorStop(0.75, rgba('#02030a',0.35));
  vg.addColorStop(1, rgba('#02030a',0.82));
  g.fillStyle=vg; g.fillRect(0,0,S,S);

  // bright sun-facing rim light
  g.globalCompositeOperation='lighter';
  const rim=g.createRadialGradient(
    cx+radius*lightX, cy+radius*lightY, radius*0.55,
    cx+radius*lightX*0.4, cy+radius*lightY*0.4, radius*1.05);
  rim.addColorStop(0, rgba(T.accent,0));
  rim.addColorStop(0.86, rgba(T.accent,0));
  rim.addColorStop(0.97, rgba(T.accent,0.55));
  rim.addColorStop(1, rgba(T.accent,0));
  g.fillStyle=rim; g.beginPath(); g.arc(cx,cy,radius,0,TAU); g.fill();

  g.restore();
  return {canvas:c, off:S/2, atmo:T.atmo, accent:T.accent};
}

/* =========================================================================
   PARTICLE SYSTEM — one pooled additive system, zero hot-loop allocs
   ========================================================================= */
const Particles = (()=>{
  const MAX=1400;
  const px=new Float32Array(MAX), py=new Float32Array(MAX);
  const vx=new Float32Array(MAX), vy=new Float32Array(MAX);
  const life=new Float32Array(MAX), maxlife=new Float32Array(MAX);
  const size=new Float32Array(MAX), drag=new Float32Array(MAX);
  const spin=new Float32Array(MAX), rot=new Float32Array(MAX);
  const kind=new Uint8Array(MAX); // 0 cyan,1 gold,2 coral,3 white
  const active=new Uint8Array(MAX);
  let cursor=0, count=0;
  const sprites=[GLOW.cyan,GLOW.gold,GLOW.coral,GLOW.white];
  function spawn(x,y,vX,vY,lf,sz,dr,k,sp){
    let i=-1;
    for(let n=0;n<MAX;n++){const idx=(cursor+n)%MAX;if(!active[idx]){i=idx;cursor=(idx+1)%MAX;break;}}
    if(i<0){i=cursor;cursor=(cursor+1)%MAX;} else count++;
    active[i]=1; px[i]=x;py[i]=y;vx[i]=vX;vy[i]=vY;
    life[i]=lf;maxlife[i]=lf;size[i]=sz;drag[i]=dr;kind[i]=k;
    spin[i]=sp||0; rot[i]=Math.random()*TAU;
  }
  function update(dt){
    count=0;
    for(let i=0;i<MAX;i++){
      if(!active[i])continue;
      life[i]-=dt;
      if(life[i]<=0){active[i]=0;continue;}
      count++;
      px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      const d=Math.pow(drag[i],dt*60);
      vx[i]*=d; vy[i]*=d;
      rot[i]+=spin[i]*dt;
    }
  }
  function draw(cam){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<MAX;i++){
      if(!active[i])continue;
      const t=life[i]/maxlife[i];
      const sx=px[i]-cam.x, sy=py[i]-cam.y;
      if(sx<-60||sx>VW+60||sy<-60||sy>VH+60)continue;
      const r=size[i]*(0.4+t*0.9);
      ctx.globalAlpha=t*t;
      ctx.drawImage(sprites[kind[i]], sx-r, sy-r, r*2, r*2);
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  function clear(){for(let i=0;i<MAX;i++)active[i]=0;count=0;}
  return {spawn,update,draw,clear, get count(){return count;}};
})();

/* =========================================================================
   CAMERA — smooth follow + velocity lookahead + speed zoom
   ========================================================================= */
const cam = {
  x:0, y:0, zoom:1, targetZoom:1,
  shakeX:0, shakeY:0, trauma:0,
  update(px,py,vx,vy,dt){
    const laX = px + vx*0.55 - VW*0.42;
    const laY = py + vy*0.35 - VH*0.5;
    this.x = lerp(this.x, laX, 1-Math.pow(1-0.08, dt*60));
    this.y = lerp(this.y, laY, 1-Math.pow(1-0.08, dt*60));
    this.zoom = lerp(this.zoom, this.targetZoom, 1-Math.pow(1-0.05,dt*60));
    // trauma-based shake (shake = trauma^2)
    this.trauma = Math.max(0, this.trauma - dt*1.6);
    const s = this.trauma*this.trauma;
    this.shakeX = rand(-1,1)*s*this.shakeMag;
    this.shakeY = rand(-1,1)*s*this.shakeMag;
  },
  shakeMag:14,
  addTrauma(t, mag){ this.trauma=Math.min(1,this.trauma+t); this.shakeMag=mag; },
};

/* =========================================================================
   WORLD — procedural chunk generation
   ========================================================================= */
const G_CONST = 5200;          // gravity strength (tuned for "earned" slingshots)
const CHUNK_W = 1600;
const world = {
  planets:[], shards:[], seed:1,
  nextChunkX:0, rng:null,
  reset(seed){
    this.planets.length=0; this.shards.length=0;
    this.seed=seed; this.rng=mulberry32(seed);
    this.nextChunkX = -400;
    for(let i=0;i<4;i++) this.genChunk();
  },
  genChunk(){
    const r=this.rng;
    const x0=this.nextChunkX;
    const nPlanets = 2 + ((r()*3)|0); // 2-4
    const placed=[];
    let attempts=0;
    while(placed.length<nPlanets && attempts<60){
      attempts++;
      const px = x0 + rand(180, CHUNK_W-180);
      const py = rand(-VH*0.5, VH*1.5);
      const radius = rand(46, 118);
      // enforce spacing + navigable corridor (>=220px gap between surfaces)
      let ok=true;
      for(const p of this.planets.concat(placed)){
        const minGap = p.radius + radius + 260;
        if(dist2(px,py,p.x,p.y) < minGap*minGap){ ok=false; break; }
      }
      // keep the probe's spawn point (world origin) and its initial lane clear
      const spawnClear = radius + 420;
      if(dist2(px,py,0,0) < spawnClear*spawnClear) ok=false;
      if(px < 620 && Math.abs(py) < radius + 240) ok=false; // clear opening corridor
      if(!ok) continue;
      const typeIdx = (r()*PLANET_TYPES.length)|0;
      const seed = (r()*1e9)|0;
      const body = renderPlanetBody(radius, typeIdx, seed);
      const hasRing = r()<0.28 && radius>60;
      const planet = {
        x:px, y:py, radius, mass: radius*radius*0.9,
        typeIdx, body, accent:body.accent, atmo:body.atmo,
        ring: hasRing? {tilt:rand(0.25,0.6), inner:radius*1.4, outer:radius*rand(1.9,2.4), rot:rand(0,TAU), col:body.accent}:null,
        spin: rand(-0.05,0.05), phase:0,
      };
      placed.push(planet);
      this.planets.push(planet);
      // shard ring: 6-10 shards on an orbital arc
      const nsh = 6 + ((r()*5)|0);
      const orbit = radius + rand(70,150);
      const a0 = rand(0,TAU);
      const arc = rand(TAU*0.5, TAU);
      for(let s=0;s<nsh;s++){
        const a=a0 + (arc*s/nsh);
        this.shards.push({
          x: px+Math.cos(a)*orbit, y: py+Math.sin(a)*orbit,
          baseA:a, orbit, cx:px, cy:py,
          rot: rand(0,TAU), pulse:rand(0,TAU), alive:true, gone:0,
        });
      }
    }
    this.nextChunkX += CHUNK_W;
  },
  ensureAhead(camRight){
    while(this.nextChunkX < camRight + CHUNK_W*1.5) this.genChunk();
  },
  cull(flareX){
    // remove content well behind the flare
    const cutoff = flareX - 900;
    if(this.planets.length>8)
      this.planets = this.planets.filter(p=> p.x + p.radius > cutoff);
    if(this.shards.length>40)
      this.shards = this.shards.filter(s=> s.cx > cutoff);
  }
};

/* =========================================================================
   BACKGROUND — four-layer parallax nebula (pre-rendered nebula clouds)
   ========================================================================= */
const BG = (()=>{
  const stars=[];       // {x,y,r,tier,tw,phase, par}
  const dust=[];        // faint diagonal band
  const streaks=[];     // foreground fast streaks
  let cloudSprite=null, cloudTiles=[];
  function initStars(){
    stars.length=0;
    for(let i=0;i<260;i++){
      const tier = Math.random()<0.12?2:(Math.random()<0.4?1:0);
      stars.push({
        x:Math.random()*3000, y:Math.random()*2000,
        r: tier===2?rand(1.4,2.2):(tier===1?rand(0.9,1.4):rand(0.4,0.9)),
        tier, tw: Math.random()<0.25, phase:rand(0,TAU),
        par: 0.10+tier*0.05,
      });
    }
    dust.length=0;
    for(let i=0;i<160;i++){
      dust.push({x:Math.random()*3000, y:Math.random()*2000, r:rand(0.3,0.9), a:rand(0.05,0.25)});
    }
    streaks.length=0;
    for(let i=0;i<26;i++){
      streaks.push({x:Math.random()*3000, y:Math.random()*2000, len:rand(24,80), par:rand(0.85,1.05)});
    }
  }
  function makeCloud(hex, size){
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d');
    g.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){
      const cx=rand(size*0.25,size*0.75), cy=rand(size*0.25,size*0.75);
      const r=rand(size*0.25,size*0.5);
      const grd=g.createRadialGradient(cx,cy,0,cx,cy,r);
      grd.addColorStop(0, rgba(hex, rand(0.10,0.20)));
      grd.addColorStop(1, rgba(hex,0));
      g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill();
    }
    return c;
  }
  function initClouds(){
    cloudTiles=[
      {c:makeCloud(COL.indigo,512), par:0.16, x:0,   y:60,  s:1.4},
      {c:makeCloud(COL.coral,512),  par:0.20, x:900, y:420, s:1.1},
      {c:makeCloud(COL.indigo,512), par:0.14, x:1700,y:120, s:1.6},
      {c:makeCloud('#4a2b7a',512),  par:0.22, x:2400,y:520, s:1.2},
      {c:makeCloud(COL.coral,512),  par:0.18, x:3200,y:260, s:1.3},
    ];
  }
  function init(){ initStars(); initClouds(); }
  function draw(cam, t, flareLight){
    // base vertical gradient sky
    const sky=ctx.createLinearGradient(0,0,0,VH);
    sky.addColorStop(0, '#090c1c');
    sky.addColorStop(0.5, COL.abyss);
    sky.addColorStop(1, '#04050d');
    ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);

    // layer 2: nebula clouds (screen/lighter)
    ctx.globalCompositeOperation='lighter';
    const wrapC=4000;
    for(const cl of cloudTiles){
      const sizeW=cl.c.width*cl.s, sizeH=cl.c.height*cl.s;
      let baseX = cl.x - cam.x*cl.par + Math.sin(t*0.03+cl.par*10)*20;
      let baseY = cl.y - cam.y*cl.par + Math.cos(t*0.02+cl.par*8)*14;
      baseX = ((baseX % wrapC)+wrapC)%wrapC - sizeW*0.5;
      for(let rep=-1; rep<=Math.ceil(VW/wrapC)+1; rep++){
        ctx.drawImage(cl.c, baseX+rep*wrapC, baseY, sizeW, sizeH);
      }
    }
    ctx.globalCompositeOperation='source-over';

    // layer 1: deep starfield (wrapped)
    const wrap=3000, wrapY=2000;
    for(const s of stars){
      let sx=(s.x - cam.x*s.par); let sy=(s.y - cam.y*s.par);
      sx=((sx%wrap)+wrap)%wrap; sy=((sy%wrapY)+wrapY)%wrapY;
      if(sx>VW+4||sy>VH+4) continue;
      let a = s.tier===2?0.95:(s.tier===1?0.7:0.45);
      if(s.tw) a *= 0.55+0.45*Math.sin(t*2.2+s.phase);
      ctx.fillStyle=rgba(COL.starlight, a);
      if(s.tier===2){
        ctx.globalCompositeOperation='lighter';
        ctx.drawImage(GLOW.white, sx-s.r*4, sy-s.r*4, s.r*8, s.r*8);
        ctx.globalCompositeOperation='source-over';
      }
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,TAU); ctx.fill();
    }
    // layer 3: dust band (diagonal wash)
    ctx.globalCompositeOperation='lighter';
    for(const d of dust){
      let sx=(d.x - cam.x*0.28); let sy=(d.y + d.x*0.12 - cam.y*0.28);
      sx=((sx%wrap)+wrap)%wrap; sy=((sy%wrapY)+wrapY)%wrapY;
      ctx.fillStyle=rgba(COL.indigo, d.a);
      ctx.fillRect(sx,sy,d.r,d.r);
    }
    ctx.globalCompositeOperation='source-over';

    // red ambient light bleed from flare (drawn over bg, tints left side)
    if(flareLight>0){
      const grd=ctx.createLinearGradient(0,0,VW*0.7,0);
      grd.addColorStop(0, rgba(COL.coral, 0.32*flareLight));
      grd.addColorStop(1, rgba(COL.coral,0));
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH);
      ctx.globalCompositeOperation='source-over';
    }
  }
  function drawStreaks(cam, speed){
    // layer 4: foreground fast streaks — only visible when moving fast
    if(speed<120) return;
    const wrap=3000, wrapY=2000;
    const a=clamp((speed-120)/600,0,0.5);
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(COL.starlight,a);
    ctx.lineWidth=1.2;
    for(const s of streaks){
      let sx=(s.x - cam.x*s.par); let sy=(s.y - cam.y*s.par);
      sx=((sx%wrap)+wrap)%wrap; sy=((sy%wrapY)+wrapY)%wrapY;
      const l=s.len*clamp(speed/400,0.3,1.5);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-l,sy); ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }
  return {init, draw, drawStreaks};
})();

/* =========================================================================
   THE FLARE — layered plasma curtain with bleeding red light
   ========================================================================= */
const Flare = {
  x:0, speed:0, baseSpeed:150, noise:null, t:0, emberT:0,
  reset(){
    this.x = -1400; this.speed=this.baseSpeed; this.t=0; this.emberT=0;
    this.noise = makeNoise((Math.random()*1e9)|0);
  },
  update(dt, playerX){
    // accelerating: +4% per 1000px of player progress, plus steady creep
    const ramp = 1 + Math.max(0,playerX)/1000*0.04;
    this.speed = this.baseSpeed*ramp + this.t*2.2;
    this.x += this.speed*dt;
    // never let it fall absurdly far behind
    if(playerX - this.x > 2600) this.x = playerX - 2600;
    this.t += dt;
    // ember particles peel off leading edge
    this.emberT += dt;
    const rate=0.014;
    while(this.emberT>rate){
      this.emberT-=rate;
      const ey = cam.y + rand(-40,VH+40);
      const edge = this.edgeX(ey);
      Particles.spawn(edge+rand(-6,24), ey, rand(40,160), rand(-40,40),
        rand(0.6,1.4), rand(6,16), 0.94, 2, rand(-3,3));
    }
  },
  edgeX(worldY){
    // wavy leading edge
    const n=this.noise(worldY*0.004, this.t*0.4);
    return this.x + n*90 + Math.sin(worldY*0.01+this.t*2)*24;
  },
  // 0..1 how close/hot the light bleed is at the given camera
  lightAt(camRight){
    const d = this.edgeX(cam.y+VH*0.5) - (cam.x); // screen-space edge
    // bleed up to 900px ahead
    const ahead = (cam.x+VW) - this.x;
    return clamp(1 - (this.x < cam.x ? (cam.x-this.x)/900 : 1), 0, 1);
  },
  proximityLight(){
    const edgeScreen = this.edgeX(cam.y+VH*0.5) - cam.x;
    return clamp(1 - edgeScreen/900, 0, 1);
  },
  kills(px,py){
    return px <= this.edgeX(py);
  },
  draw(cam){
    const edgeScreenBase = this.x - cam.x;
    if(edgeScreenBase > VW+80) return;
    // 3+ vertically scrolling plasma bands, Coral->Gold, lighter comp
    ctx.save();
    const layers=[
      {off:-30, hue0:COL.coral, hue1:'#7a1a12', speed:60,  a:0.9,  freq:0.006},
      {off:10,  hue0:COL.gold,  hue1:COL.coral, speed:110, a:0.7,  freq:0.009},
      {off:40,  hue0:'#fff1c2', hue1:COL.gold,  speed:170, a:0.55, freq:0.013},
    ];
    ctx.globalCompositeOperation='lighter';
    for(const L of layers){
      ctx.beginPath();
      const scroll=this.t*L.speed;
      ctx.moveTo(-40, -40);
      for(let sy=-40; sy<=VH+40; sy+=14){
        const wy=cam.y+sy;
        const n=this.noise(wy*L.freq, this.t*0.5+L.off*0.01);
        const n2=this.noise(wy*L.freq*2.3+scroll*0.001, this.t*0.9);
        const ex = this.edgeX(wy) - cam.x + L.off + (n-0.5)*120 + (n2-0.5)*50;
        ctx.lineTo(ex, sy);
      }
      ctx.lineTo(-40, VH+40); ctx.closePath();
      const grd=ctx.createLinearGradient(edgeScreenBase-260,0, edgeScreenBase+80,0);
      grd.addColorStop(0, rgba(L.hue1,0));
      grd.addColorStop(0.55, rgba(L.hue1, L.a*0.5));
      grd.addColorStop(0.9, rgba(L.hue0, L.a));
      grd.addColorStop(1, rgba('#ffffff', L.a*0.7));
      ctx.fillStyle=grd; ctx.fill();
    }
    // bright flickering leading edge
    const flick=0.6+0.4*Math.sin(this.t*30)+0.2*Math.sin(this.t*67);
    ctx.beginPath();
    for(let sy=-40; sy<=VH+40; sy+=8){
      const wy=cam.y+sy;
      const ex=this.edgeX(wy)-cam.x;
      if(sy===-40) ctx.moveTo(ex,sy); else ctx.lineTo(ex,sy);
    }
    ctx.strokeStyle=rgba('#fff4d6', clamp(flick*0.5,0,0.9));
    ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle=rgba(COL.gold, clamp(flick*0.35,0,0.7));
    ctx.lineWidth=8; ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }
};

/* =========================================================================
   THE PROBE — jewel + ribbon trail + fuel + thrust
   ========================================================================= */
const probe = {
  x:0, y:0, vx:0, vy:0, angle:0, aimX:0, aimY:0,
  fuel:1, thrusting:false, alive:true,
  trail:[],           // {x,y}
  maxTrail:46,
  reset(){
    this.x=0; this.y=0; this.vx=120; this.vy=0; this.fuel=1;
    this.thrusting=false; this.alive=true; this.angle=0;
    this.trail.length=0;
  },
  update(dt){
    // gravity from planets
    let ax=0, ay=0;
    for(const p of world.planets){
      const dx=p.x-this.x, dy=p.y-this.y;
      let r2=dx*dx+dy*dy;
      const minR=p.radius*1.02;
      if(r2<minR*minR) r2=minR*minR;
      const f = G_CONST*p.mass / r2;
      const inv=1/Math.sqrt(r2);
      ax+=dx*inv*f; ay+=dy*inv*f;
    }
    // thrust toward aim
    if(this.thrusting && this.fuel>0){
      const dx=this.aimX-this.x, dy=this.aimY-this.y;
      const l=Math.hypot(dx,dy)||1;
      const TH=560;
      ax+=dx/l*TH; ay+=dy/l*TH;
      this.angle=Math.atan2(dy,dx);
      this.fuel=Math.max(0,this.fuel - dt*0.28);
      // thruster embers
      const bx=this.x - Math.cos(this.angle)*10, by=this.y - Math.sin(this.angle)*10;
      Particles.spawn(bx,by,
        -Math.cos(this.angle)*rand(40,140)+rand(-30,30),
        -Math.sin(this.angle)*rand(40,140)+rand(-30,30),
        rand(0.3,0.6), rand(4,9), 0.9, 0, 0);
      if(Math.random()<0.5) Audio.thruster(clamp(this.fuel+0.3,0.3,1));
    } else if(!this.thrusting){
      // face velocity when drifting
      const sp=Math.hypot(this.vx,this.vy);
      if(sp>4) this.angle=Math.atan2(this.vy,this.vx);
    }
    this.vx+=ax*dt; this.vy+=ay*dt;
    // gentle global speed clamp for control
    const sp=Math.hypot(this.vx,this.vy);
    const MAXV=1150;
    if(sp>MAXV){ this.vx*=MAXV/sp; this.vy*=MAXV/sp; }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
  },
  pushTrail(){
    this.trail.push({x:this.x, y:this.y});
    if(this.trail.length>this.maxTrail) this.trail.shift();
  },
  speed(){return Math.hypot(this.vx,this.vy);},
  drawTrail(cam){
    const n=this.trail.length;
    if(n<2) return;
    ctx.globalCompositeOperation='lighter';
    const sp=this.speed();
    const wBase=clamp(sp/380,0.5,1)*7;
    for(let i=1;i<n;i++){
      const t=i/n;
      const a=this.trail[i-1], b=this.trail[i];
      const col=mixHex(COL.cyan, COL.starlight, t);
      ctx.strokeStyle=rgba(col, t*0.5);
      ctx.lineWidth=wBase*t + 0.5;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(a.x-cam.x, a.y-cam.y);
      ctx.lineTo(b.x-cam.x, b.y-cam.y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  },
  draw(cam, redTint){
    const sx=this.x-cam.x, sy=this.y-cam.y;
    // thruster flame (3 layered gradients) when thrusting
    if(this.thrusting && this.fuel>0){
      const fl=14+Math.sin(performance.now()*0.05)*4;
      const bx=sx-Math.cos(this.angle)*10, by=sy-Math.sin(this.angle)*10;
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.translate(bx,by); ctx.rotate(this.angle);
      const grds=[
        {r:fl*1.8, c0:rgba(COL.cyan,0), c1:rgba(COL.cyan,0.6)},
        {r:fl*1.1, c0:rgba('#bff6ff',0), c1:rgba('#bff6ff',0.8)},
        {r:fl*0.5, c0:rgba('#ffffff',0), c1:rgba('#ffffff',1)},
      ];
      for(const G of grds){
        const g=ctx.createRadialGradient(-G.r*0.4,0,0,-G.r*0.4,0,G.r);
        g.addColorStop(0,G.c1); g.addColorStop(1,G.c0);
        ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(-G.r*0.5,0,G.r,G.r*0.5,0,0,TAU); ctx.fill();
      }
      ctx.restore();
    }
    // glow halo
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(GLOW.cyan, sx-22, sy-22, 44,44);
    ctx.globalCompositeOperation='source-over';
    // body — sleek elongated gradient hull
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(this.angle);
    const hull=ctx.createLinearGradient(-9,0,11,0);
    hull.addColorStop(0, '#0d1830');
    hull.addColorStop(0.5, '#33507a');
    hull.addColorStop(1, '#cfeeff');
    ctx.fillStyle=hull;
    ctx.beginPath();
    ctx.moveTo(13,0); ctx.lineTo(-7,5.5); ctx.lineTo(-4,0); ctx.lineTo(-7,-5.5);
    ctx.closePath(); ctx.fill();
    // wing fins
    ctx.fillStyle=rgba(COL.cyan,0.55);
    ctx.beginPath(); ctx.moveTo(-2,3.5); ctx.lineTo(-9,8); ctx.lineTo(-5,3.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,-3.5); ctx.lineTo(-9,-8); ctx.lineTo(-5,-3.5); ctx.closePath(); ctx.fill();
    // cockpit dot
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rgba(COL.cyan,1);
    ctx.beginPath(); ctx.arc(3,0,2.4,0,TAU); ctx.fill();
    ctx.fillStyle=rgba('#ffffff',0.9);
    ctx.beginPath(); ctx.arc(3,0,1.1,0,TAU); ctx.fill();
    ctx.restore();
    // red tint from flare
    if(redTint>0){
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=rgba(COL.coral,redTint*0.5);
      ctx.beginPath(); ctx.arc(sx,sy,14,0,TAU); ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
  }
};

/* =========================================================================
   GAME STATE + LOGIC
   ========================================================================= */
const UI = { scale:1 };
const Game = {
  state:'TITLE',           // TITLE, PLAYING, DEAD
  score:0, displayScore:0,
  distance:0, startX:0,
  shards:0, combo:1, comboTimer:0, comboStep:0, bestCombo:1,
  perihelions:0,
  fuelGhost:1,
  hitstop:0, slowmo:0, deathT:0,
  flash:0, chroma:0, desat:0,
  hintT:0,
  fragments:[],            // death fragments
  periFlash:0, periScale:0,
  newRecord:false,
  proxBlink:0,
  time:0,

  startRun(){
    const seed=(Math.random()*1e9)|0;
    world.reset(seed);
    probe.reset();
    Particles.clear();
    Flare.reset();
    cam.x=probe.x-VW*0.42; cam.y=probe.y-VH*0.5; cam.trauma=0; cam.zoom=1; cam.targetZoom=1;
    this.state='PLAYING';
    this.score=0; this.displayScore=0; this.distance=0; this.startX=probe.x;
    this.shards=0; this.combo=1; this.comboTimer=0; this.comboStep=0; this.bestCombo=1;
    this.perihelions=0; this.fuelGhost=1;
    this.hitstop=0; this.slowmo=0; this.deathT=0; this.flash=0; this.chroma=0; this.desat=0;
    this.hintT=10; this.fragments.length=0; this.periFlash=0; this.newRecord=false; this.proxBlink=0;
    Store.runs++; Store.save();
  },

  die(){
    if(!probe.alive) return;
    probe.alive=false;
    this.state='DEAD';
    this.hitstop=0.08;
    this.slowmo=0.4; this.deathT=0;
    this.flash=1; this.desat=0;
    cam.addTrauma(1, 14);
    Audio.death();
    // 40+ glowing fragments
    for(let i=0;i<48;i++){
      const a=rand(0,TAU), sp=rand(60,420);
      this.fragments.push({
        x:probe.x, y:probe.y,
        vx:Math.cos(a)*sp+probe.vx*0.3, vy:Math.sin(a)*sp+probe.vy*0.3,
        life:rand(0.8,1.8), max:1.8, rot:rand(0,TAU), spin:rand(-8,8),
        size:rand(2,6), col: Math.random()<0.5?COL.cyan:(Math.random()<0.5?COL.starlight:COL.gold),
      });
      Particles.spawn(probe.x,probe.y,Math.cos(a)*sp,Math.sin(a)*sp,rand(0.6,1.4),rand(6,14),0.9,
        Math.random()<0.5?0:3, rand(-4,4));
    }
    // finalize score
    const finalScore=this.score|0;
    const finalDist=this.distance|0;
    if(finalScore>Store.bestScore){ Store.bestScore=finalScore; this.newRecord=true; }
    if(finalDist>Store.bestDist) Store.bestDist=finalDist;
    Store.save();
    if(this.newRecord) setTimeout(()=>Audio.record(), 700);
  },

  addShard(sh, x, y){
    const doubled = this.periFlash>0.01;
    const gain = 10*this.combo*(doubled?2:1);
    this.score += gain;
    this.shards += doubled?2:1;
    // combo chain
    this.comboTimer=2.5;
    if(this.combo<8){ this.comboStep++; this.combo=Math.min(8,Math.pow(2,this.comboStep)); }
    this.bestCombo=Math.max(this.bestCombo,this.combo);
    Audio.shard(this.comboStep);
    cam.addTrauma(0.18, 2);
    // burst 12-18 gold sparkles
    const n=randi(12,18);
    for(let i=0;i<n;i++){
      const a=rand(0,TAU), sp=rand(60,260);
      Particles.spawn(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rand(0.4,0.9),rand(4,9),0.88,1,rand(-4,4));
    }
  },

  perihelion(x,y){
    this.perihelions++;
    this.score += 250*this.combo;
    probe.fuel=Math.min(1, probe.fuel+0.5);
    this.periFlash=1.2; this.periScale=1;
    this.chroma=1;
    this.hitstop=Math.max(this.hitstop,0.07);
    cam.addTrauma(0.55, 5);
    Audio.perihelion();
    for(let i=0;i<40;i++){
      const a=rand(0,TAU), sp=rand(120,520);
      Particles.spawn(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rand(0.5,1.2),rand(6,13),0.9,
        Math.random()<0.5?1:3, rand(-5,5));
    }
  },

  fixedStep(dt){
    if(this.state!=='PLAYING') return;
    if(this.hitstop>0){ this.hitstop-=dt; return; }
    this.time+=dt;

    probe.update(dt);
    probe.pushTrail();

    // world streaming
    world.ensureAhead(cam.x+VW);
    world.cull(Flare.x);
    Flare.update(dt, probe.x-this.startX);

    // planet spin / phase for rings
    for(const p of world.planets){ p.phase+=p.spin*dt; }

    // shard collection + orbit motion
    for(const s of world.shards){
      if(!s.alive){ s.gone+=dt; continue; }
      s.rot+=dt*1.3; s.pulse+=dt*3;
      // orbit drift
      s.baseA += dt*0.15;
      s.x = s.cx + Math.cos(s.baseA)*s.orbit;
      s.y = s.cy + Math.sin(s.baseA)*s.orbit;
      if(dist2(s.x,s.y,probe.x,probe.y) < 22*22){
        s.alive=false; s.gone=0;
        this.addShard(s, s.x, s.y);
      }
    }

    // planet collision + perihelion detection
    for(const p of world.planets){
      const d=Math.hypot(p.x-probe.x, p.y-probe.y);
      if(d < p.radius+8){ this.die(); return; }
      // perihelion: skim close at high velocity
      const skimBand = p.radius+8 + p.radius*0.55;
      if(d < skimBand && probe.speed()>430 && !p._peri){
        p._peri=true; p._periCool=0;
        this.perihelion(probe.x, probe.y);
      }
      if(p._peri){ p._periCool=(p._periCool||0)+dt; if(d>skimBand+40||p._periCool>2){ p._peri=false; } }
    }

    // flare kill
    if(Flare.kills(probe.x, probe.y)){ this.die(); return; }

    // combo decay
    if(this.comboTimer>0){ this.comboTimer-=dt; if(this.comboTimer<=0){ this.combo=1; this.comboStep=0; } }

    // score from distance
    this.distance = Math.max(this.distance, (probe.x-this.startX)*0.1);
    this.score = Math.max(this.score, this.distance*1.0 + this.shards*0); // distance contributes
    // (score already includes shard/peri bonuses added above; keep max)

    // periFlash decay
    if(this.periFlash>0) this.periFlash-=dt;
    if(this.chroma>0) this.chroma-=dt*2.5;
    if(this.hintT>0) this.hintT-=dt;

    // camera zoom out with speed
    cam.targetZoom = clamp(1 + probe.speed()/6000, 1, 1.15);
    this.proxBlink+=dt;
  },

  updateVisual(dt){
    // things that update every frame regardless of fixed step
    if(this.state==='DEAD'){
      this.deathT+=dt;
      if(this.slowmo>0) this.slowmo-=dt;
      if(this.desat<1) this.desat=Math.min(1,this.desat+dt*2.5);
      // fragments
      for(const f of this.fragments){
        f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.spin*dt; f.vx*=0.98; f.vy*=0.98;
      }
      this.fragments=this.fragments.filter(f=>f.life>0);
    }
    if(this.flash>0) this.flash-=dt*2.2;
    // smooth score counter
    this.displayScore = lerp(this.displayScore, this.score, 1-Math.pow(0.001,dt));
    // fuel ghost bar lag
    this.fuelGhost = lerp(this.fuelGhost, probe.fuel, 1-Math.pow(0.02,dt));
    // peri scale-pop
    if(this.periScale>0) this.periScale=Math.max(0,this.periScale-dt*3.3);
    // camera follow uses real player during play, drifts on death
    if(this.state==='PLAYING'){
      cam.update(probe.x,probe.y,probe.vx,probe.vy,dt);
    } else {
      cam.update(probe.x,probe.y,probe.vx*0.2,probe.vy*0.2,dt);
    }
  }
};

/* ---- Title attract-mode orbit probe ---- */
const attract = { a:0, cx:0, cy:0 };

/* =========================================================================
   RENDER
   ========================================================================= */
function render(alpha){
  const t=performance.now()*0.001;
  const flareLight = Game.state==='PLAYING'||Game.state==='DEAD' ? Flare.proximityLight() : 0;

  // apply shake by translating camera
  const camDraw = { x:cam.x+cam.shakeX, y:cam.y+cam.shakeY };

  // scale for zoom around screen center
  ctx.save();
  const z=cam.zoom;
  if(z!==1){ ctx.translate(VW/2,VH/2); ctx.scale(z,z); ctx.translate(-VW/2,-VH/2); }

  BG.draw(camDraw, t, flareLight);

  if(Game.state==='TITLE'){
    renderTitleWorld(camDraw, t);
  } else {
    // planets
    for(const p of world.planets) drawPlanet(p, camDraw, flareLight);
    // shards
    drawShards(camDraw, t);
    // trail + probe (or fragments)
    if(probe.alive){
      probe.drawTrail(camDraw);
      const redT = clamp(flareLight*1.0,0,0.8) * (probe.x-Flare.x<700?1:0.3);
      probe.draw(camDraw, redT);
    } else {
      drawFragments(camDraw);
    }
    // particles
    Particles.draw(camDraw);
    // flare on top of world (it's a wall in front of everything behind it)
    Flare.draw(camDraw);
    BG.drawStreaks(camDraw, probe.speed());
    // combo ring around probe
    if(probe.alive) drawComboRing(camDraw);
  }

  ctx.restore(); // end zoom

  // ---- post FX (screen space) ----
  postFX();

  // ---- UI ----
  if(Game.state==='TITLE') drawTitle(t);
  else drawHUD(t);
  if(Game.state==='PLAYING') drawHints();
  if(Game.state==='DEAD') drawGameOver();
  drawMuteIndicator();
}

function renderTitleWorld(cam, t){
  // a couple of drifting planets + attract probe orbit behind logo
  for(const p of world.planets.slice(0,3)) drawPlanet(p, cam, 0);
  // attract probe
  attract.a += 0.006;
  const cx=VW*0.5, cy=VH*0.46;
  const rx=Math.min(VW,VH)*0.28, ry=rx*0.5;
  const ax=cx+Math.cos(attract.a)*rx, ay=cy+Math.sin(attract.a)*ry;
  // fake a small trail
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<30;i++){
    const aa=attract.a-i*0.04;
    const tx=cx+Math.cos(aa)*rx, ty=cy+Math.sin(aa)*ry;
    const f=1-i/30;
    ctx.strokeStyle=rgba(mixHex(COL.cyan,COL.starlight,i/30), f*0.4);
    ctx.lineWidth=5*f;
    const aa2=attract.a-(i+1)*0.04;
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.lineTo(cx+Math.cos(aa2)*rx, cy+Math.sin(aa2)*ry); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  const ang=Math.atan2(Math.cos(attract.a)*ry, -Math.sin(attract.a)*rx);
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(ang+Math.PI);
  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(GLOW.cyan,-20,-20,40,40);
  ctx.globalCompositeOperation='source-over';
  const hull=ctx.createLinearGradient(-9,0,11,0);
  hull.addColorStop(0,'#0d1830'); hull.addColorStop(0.5,'#33507a'); hull.addColorStop(1,'#cfeeff');
  ctx.fillStyle=hull;
  ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(-7,5.5); ctx.lineTo(-4,0); ctx.lineTo(-7,-5.5); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=COL.cyan; ctx.beginPath(); ctx.arc(3,0,2.4,0,TAU); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function drawPlanet(p, cam, flareLight){
  const sx=p.x-cam.x, sy=p.y-cam.y;
  const off=p.body.off;
  if(sx+off<0||sx-off>VW||sy+off<0||sy-off>VH) return;
  // ring behind
  if(p.ring) drawRing(p, sx, sy, false);
  // atmosphere extra glow bloom
  ctx.globalCompositeOperation='lighter';
  const bloom=p.radius*2.4;
  ctx.globalAlpha=0.5;
  const gs = p.atmo===COL.coral||p.atmo===COL.gold?GLOW.coral:(p.atmo===COL.cyan?GLOW.cyan:GLOW.white);
  ctx.drawImage(gs, sx-bloom, sy-bloom, bloom*2, bloom*2);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  // body
  ctx.drawImage(p.body.canvas, sx-off, sy-off);
  // red flare tint on the shadow (left) side
  if(flareLight>0 && p.x-Flare.x<900){
    const tint=clamp(flareLight*(1-(p.x-Flare.x)/900),0,0.6);
    ctx.save();
    ctx.beginPath(); ctx.arc(sx,sy,p.radius,0,TAU); ctx.clip();
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createLinearGradient(sx-p.radius,0,sx+p.radius*0.3,0);
    g.addColorStop(0,rgba(COL.coral,tint)); g.addColorStop(1,rgba(COL.coral,0));
    ctx.fillStyle=g; ctx.fillRect(sx-p.radius,sy-p.radius,p.radius*2,p.radius*2);
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }
  // ring in front
  if(p.ring) drawRing(p, sx, sy, true);
}

function drawRing(p, sx, sy, front){
  const r=p.ring;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(r.rot);
  ctx.scale(1, r.tilt);
  ctx.beginPath();
  // draw only front or back half by clipping in y
  const grd=ctx.createRadialGradient(0,0,r.inner,0,0,r.outer);
  grd.addColorStop(0, rgba(r.col,0));
  grd.addColorStop(0.4, rgba(r.col,0.28));
  grd.addColorStop(0.7, rgba(r.col,0.14));
  grd.addColorStop(1, rgba(r.col,0));
  ctx.strokeStyle=grd;
  for(let rr=r.inner; rr<r.outer; rr+=3){
    ctx.globalAlpha = 0.5*(1-(rr-r.inner)/(r.outer-r.inner));
    ctx.beginPath();
    if(front) ctx.arc(0,0,rr,0,Math.PI);
    else ctx.arc(0,0,rr,Math.PI,TAU);
    ctx.strokeStyle=rgba(r.col, 0.22*(1-Math.abs((rr-(r.inner+r.outer)/2))/((r.outer-r.inner)/2)));
    ctx.lineWidth=2.4; ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawShards(cam, t){
  ctx.globalCompositeOperation='lighter';
  for(const s of world.shards){
    if(!s.alive) continue;
    const sx=s.x-cam.x, sy=s.y-cam.y;
    if(sx<-30||sx>VW+30||sy<-30||sy>VH+30) continue;
    const pulse=0.7+0.3*Math.sin(s.pulse);
    // bloom
    ctx.globalAlpha=0.8*pulse;
    ctx.drawImage(GLOW.gold, sx-16, sy-16, 32,32);
    ctx.globalAlpha=1;
    // 6-pointed sparkle
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(s.rot);
    ctx.strokeStyle=rgba(COL.gold, 0.95);
    ctx.lineWidth=1.6;
    const R=7*pulse;
    for(let k=0;k<3;k++){
      const a=k*Math.PI/3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R, Math.sin(a)*R);
      ctx.lineTo(-Math.cos(a)*R, -Math.sin(a)*R);
      ctx.stroke();
    }
    ctx.fillStyle=rgba('#ffffff',0.95);
    ctx.beginPath(); ctx.arc(0,0,1.8,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation='source-over';
}

function drawFragments(cam){
  ctx.globalCompositeOperation='lighter';
  for(const f of Game.fragments){
    const sx=f.x-cam.x, sy=f.y-cam.y;
    const a=clamp(f.life/f.max,0,1);
    ctx.globalAlpha=a;
    ctx.drawImage(GLOW.white, sx-f.size*3, sy-f.size*3, f.size*6, f.size*6);
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(f.rot);
    ctx.fillStyle=rgba(f.col, a);
    ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size*0.6);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

function drawComboRing(cam){
  if(Game.combo<=1 && Game.comboTimer<=0) return;
  const sx=probe.x-cam.x, sy=probe.y-cam.y;
  const decay=clamp(Game.comboTimer/2.5,0,1);
  const R=26+Game.comboStep*3;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rgba(COL.gold, 0.5+0.3*decay);
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.arc(sx,sy,R, -Math.PI/2, -Math.PI/2 + TAU*decay);
  ctx.stroke();
  // subtle inner ring
  ctx.strokeStyle=rgba(COL.cyan, 0.25*decay);
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(sx,sy,R-4,0,TAU); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
}

/* -------- Post FX: vignette, grain, chroma pulse, desat, flash -------- */
let grainCanvas=null, grainCtx=null, grainT=0;
function initGrain(){
  grainCanvas=document.createElement('canvas'); grainCanvas.width=grainCanvas.height=128;
  grainCtx=grainCanvas.getContext('2d');
}
function postFX(){
  const t=performance.now();
  // chromatic bloom pulse on perihelion
  if(Game.chroma>0.01){
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=Game.chroma*0.25;
    ctx.fillStyle=rgba(COL.cyan,1); ctx.fillRect(-3,0,VW,VH);
    ctx.fillStyle=rgba(COL.coral,1); ctx.fillRect(3,0,VW,VH);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  // death radial flash + desaturation sweep
  if(Game.flash>0.01){
    const g=ctx.createRadialGradient(VW/2,VH/2,0,VW/2,VH/2,Math.max(VW,VH)*0.7);
    g.addColorStop(0, rgba('#ffffff', Game.flash*0.8));
    g.addColorStop(0.4, rgba(COL.cyan, Game.flash*0.3));
    g.addColorStop(1, rgba('#ffffff',0));
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
    ctx.globalCompositeOperation='source-over';
  }
  if(Game.desat>0.01 && Game.state==='DEAD'){
    ctx.fillStyle=rgba('#0a0d18', Game.desat*0.35);
    ctx.fillRect(0,0,VW,VH);
  }
  // flare proximity red edge pulse
  const prox = (Game.state==='PLAYING') ? Flare.proximityLight() : 0;
  if(prox>0.35){
    const pulse=0.5+0.5*Math.sin(t*0.008);
    const a=(prox-0.35)/0.65*0.5*pulse;
    const g=ctx.createLinearGradient(0,0,VW*0.35,0);
    g.addColorStop(0,rgba(COL.coral,a)); g.addColorStop(1,rgba(COL.coral,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
    const g2=ctx.createLinearGradient(0,0,0,VH*0.2);
    g2.addColorStop(0,rgba(COL.coral,a*0.6)); g2.addColorStop(1,rgba(COL.coral,0));
    ctx.fillStyle=g2; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle=rgba(COL.coral,a*0.6);
  }
  // vignette
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35,VW/2,VH/2,Math.max(VW,VH)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  // film grain (~3%)
  grainT+=1;
  if(grainT%2===0){
    const img=grainCtx.createImageData(128,128);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const v=(Math.random()*255)|0;
      d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
    }
    grainCtx.putImageData(img,0,0);
  }
  ctx.globalAlpha=0.035;
  ctx.globalCompositeOperation='overlay';
  const pat=ctx.createPattern(grainCanvas,'repeat');
  ctx.fillStyle=pat; ctx.fillRect(0,0,VW,VH);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}

/* ------------------------------ UI drawing ------------------------------ */
function glassPanel(x,y,w,h,r){
  ctx.save();
  roundRect(x,y,w,h,r);
  ctx.fillStyle='rgba(10,14,28,0.42)';
  ctx.fill();
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(234,242,255,0.14)';
  ctx.stroke();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function drawHUD(t){
  const S=UI.scale;
  ctx.textBaseline='alphabetic';
  // Top-left: DIST odometer
  const pw=170*S, ph=54*S;
  glassPanel(16*S,16*S,pw,ph,14*S);
  ctx.fillStyle='rgba(234,242,255,0.55)';
  ctx.font=`500 ${11*S}px "IBM Plex Mono", monospace`;
  ctx.fillText('DIST', 30*S, 40*S);
  ctx.fillStyle=COL.starlight;
  ctx.font=`600 ${26*S}px "Unbounded", sans-serif`;
  ctx.save(); ctx.shadowColor=rgba(COL.cyan,0.6); ctx.shadowBlur=12*S;
  ctx.fillText(fmt(Game.distance)+'', 30*S, 62*S);
  ctx.restore();
  ctx.fillStyle='rgba(234,242,255,0.4)'; ctx.font=`500 ${10*S}px "IBM Plex Mono"`;
  ctx.fillText('KM', 30*S+ctx.measureText(fmt(Game.distance)).width*0+ (pw-34*S), 62*S);

  // Top-right: shards + combo ring
  const rw=150*S;
  glassPanel(VW-16*S-rw, 16*S, rw, ph, 14*S);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(234,242,255,0.55)';
  ctx.font=`500 ${11*S}px "IBM Plex Mono"`;
  ctx.fillText('SHARDS', VW-16*S-rw+14*S, 40*S);
  ctx.fillStyle=COL.gold;
  ctx.font=`600 ${24*S}px "Unbounded"`;
  ctx.save(); ctx.shadowColor=rgba(COL.gold,0.6); ctx.shadowBlur=12*S;
  ctx.fillText(fmt(Game.shards), VW-16*S-rw+14*S, 62*S);
  ctx.restore();
  // combo ring
  const crx=VW-42*S, cry=42*S, crr=18*S;
  const decay=clamp(Game.comboTimer/2.5,0,1);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rgba(COL.gold,0.25); ctx.lineWidth=3*S;
  ctx.beginPath(); ctx.arc(crx,cry,crr,0,TAU); ctx.stroke();
  if(decay>0){
    ctx.strokeStyle=rgba(COL.gold,0.9); ctx.lineWidth=3*S;
    ctx.beginPath(); ctx.arc(crx,cry,crr,-Math.PI/2,-Math.PI/2+TAU*decay); ctx.stroke();
  }
  ctx.restore();
  const popS = 1 + (Game.periScale>0?0:0);
  ctx.fillStyle=Game.combo>1?COL.gold:'rgba(234,242,255,0.6)';
  ctx.font=`700 ${13*S}px "Space Grotesk"`;
  ctx.textAlign='center';
  ctx.fillText('×'+Game.combo, crx, cry+4*S);
  ctx.textAlign='left';

  // Bottom-left: fuel bar with ghost lag
  const fw=190*S, fh=44*S, fx=16*S, fy=VH-16*S-fh;
  glassPanel(fx,fy,fw,fh,14*S);
  ctx.fillStyle='rgba(234,242,255,0.55)'; ctx.font=`500 ${10*S}px "IBM Plex Mono"`;
  ctx.fillText('FUEL', fx+14*S, fy+18*S);
  const barX=fx+14*S, barY=fy+24*S, barW=fw-28*S, barH=8*S;
  roundRect(barX,barY,barW,barH,barH/2); ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fill();
  // ghost bar
  roundRect(barX,barY,barW*clamp(Game.fuelGhost,0,1),barH,barH/2);
  ctx.fillStyle=rgba(COL.starlight,0.2); ctx.fill();
  // real fill
  const low=probe.fuel<0.2;
  const fillCol=low? COL.coral: COL.cyan;
  roundRect(barX,barY,barW*clamp(probe.fuel,0,1),barH,barH/2);
  ctx.save(); ctx.shadowColor=rgba(fillCol,0.8); ctx.shadowBlur=10*S;
  const fg=ctx.createLinearGradient(barX,0,barX+barW,0);
  fg.addColorStop(0,rgba(fillCol,0.8)); fg.addColorStop(1,fillCol);
  ctx.fillStyle=fg; ctx.fill();
  ctx.restore();
  if(low){
    const p=0.5+0.5*Math.sin(t*0.01);
    ctx.fillStyle=rgba(COL.coral,0.5+0.4*p); ctx.font=`500 ${9*S}px "IBM Plex Mono"`;
    ctx.textAlign='right'; ctx.fillText('LOW', fx+fw-14*S, fy+18*S); ctx.textAlign='left';
  }

  // Bottom-right: BEST + score
  const bw=170*S, bh=44*S, bx=VW-16*S-bw, by=VH-16*S-bh;
  glassPanel(bx,by,bw,bh,14*S);
  ctx.fillStyle='rgba(234,242,255,0.55)'; ctx.font=`500 ${10*S}px "IBM Plex Mono"`;
  ctx.fillText('SCORE', bx+14*S, by+18*S);
  ctx.fillStyle=COL.starlight; ctx.font=`600 ${20*S}px "Unbounded"`;
  ctx.fillText(fmt(Game.displayScore), bx+14*S, by+38*S);
  ctx.fillStyle='rgba(234,242,255,0.4)'; ctx.font=`500 ${9*S}px "IBM Plex Mono"`;
  ctx.textAlign='right';
  ctx.fillText('BEST '+fmt(Store.bestScore), bx+bw-14*S, by+18*S);
  ctx.textAlign='left';

  // Flare proximity warning
  const prox=Flare.proximityLight();
  if(prox>0.4){
    const blink=Math.sin(t*0.012)>0;
    if(blink){
      ctx.fillStyle=rgba(COL.coral,0.9);
      ctx.font=`700 ${16*S}px "Space Grotesk"`;
      ctx.textAlign='center';
      ctx.save(); ctx.shadowColor=rgba(COL.coral,0.8); ctx.shadowBlur=16*S;
      ctx.fillText('⚠ FLARE PROXIMITY', VW/2, 46*S);
      ctx.restore();
      ctx.textAlign='left';
    }
  }

  // Perihelion callout
  if(Game.periFlash>0.01){
    const life=clamp(Game.periFlash/1.2,0,1);
    const pop=1+ (1-clamp((1.2-Game.periFlash)/0.3,0,1))*0.5; // 300ms scale-pop
    ctx.save();
    ctx.translate(VW/2, VH*0.34);
    ctx.scale(pop,pop);
    ctx.globalAlpha=clamp(life*1.5,0,1);
    ctx.textAlign='center';
    ctx.fillStyle=COL.gold;
    ctx.font=`800 ${44*S}px "Unbounded"`;
    ctx.shadowColor=rgba(COL.gold,0.9); ctx.shadowBlur=30*S;
    ctx.fillText('PERIHELION', 0,0);
    ctx.font=`500 ${12*S}px "IBM Plex Mono"`;
    ctx.shadowBlur=0; ctx.fillStyle=rgba(COL.starlight,0.7);
    ctx.fillText('FUEL RESTORED  ·  ×2 SHARDS', 0, 26*S);
    ctx.restore();
    ctx.textAlign='left';
  }
}

function drawHints(){
  if(Game.hintT<=0) return;
  const S=UI.scale;
  const sx=probe.x-cam.x, sy=probe.y-cam.y;
  const hints=[
    {txt:'HOLD TO BURN', t0:10, t1:7, dy:-46},
    {txt:'RELEASE TO DRIFT', t0:7, t1:4.5, dy:-64},
    {txt:'SKIM PLANETS TO REFUEL', t0:5, t1:1, dy:34},
  ];
  ctx.textAlign='center';
  for(const h of hints){
    if(Game.hintT>h.t0 || Game.hintT<h.t1) continue;
    const span=h.t0-h.t1;
    const local=(Game.hintT-h.t1)/span; // 1..0
    const a=Math.sin(local*Math.PI)*0.9;
    ctx.fillStyle=rgba(COL.starlight,a);
    ctx.font=`500 ${12*S}px "IBM Plex Mono"`;
    ctx.save(); ctx.shadowColor=rgba(COL.cyan,a*0.6); ctx.shadowBlur=10*S;
    ctx.fillText(h.txt, sx, sy+h.dy*S);
    ctx.restore();
  }
  ctx.textAlign='left';
}

function drawTitle(t){
  const S=UI.scale;
  // darken slightly for legibility
  ctx.fillStyle='rgba(7,9,20,0.35)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  // title
  const pulse=0.85+0.15*Math.sin(t*1.4);
  ctx.save();
  ctx.shadowColor=rgba(COL.cyan,0.8*pulse); ctx.shadowBlur=40*S;
  ctx.fillStyle=COL.starlight;
  const titleSize=clamp(VW*0.11, 44, 130)*1;
  ctx.font=`800 ${titleSize}px "Unbounded", sans-serif`;
  ctx.fillText('PERIHELION', VW/2, VH*0.42);
  ctx.restore();
  // sub-line
  ctx.fillStyle=rgba(COL.starlight,0.7);
  ctx.font=`500 ${clamp(VW*0.02,14,22)}px "Space Grotesk"`;
  ctx.fillText('Gravity is your engine.', VW/2, VH*0.42+titleSize*0.5+18*S);
  // prompt
  const pa=0.5+0.5*Math.sin(t*3);
  ctx.fillStyle=rgba(COL.cyan,0.6+0.4*pa);
  ctx.font=`500 ${clamp(VW*0.016,12,17)}px "IBM Plex Mono"`;
  ctx.save(); ctx.shadowColor=rgba(COL.cyan,pa*0.8); ctx.shadowBlur=16*S;
  ctx.fillText('CLICK  /  TAP  /  SPACE  TO  BURN', VW/2, VH*0.66);
  ctx.restore();
  // best readout
  if(Store.bestScore>0){
    ctx.fillStyle=rgba(COL.starlight,0.5);
    ctx.font=`400 ${clamp(VW*0.014,11,14)}px "IBM Plex Mono"`;
    ctx.fillText('BEST '+fmt(Store.bestScore)+'   ·   '+fmt(Store.bestDist)+' KM   ·   RUNS '+Store.runs, VW/2, VH*0.72);
  }
  // mute hint
  ctx.fillStyle=rgba(COL.starlight,0.3);
  ctx.font=`400 ${11*S}px "IBM Plex Mono"`;
  ctx.fillText('M MUTE   ·   P PAUSE', VW/2, VH*0.9);
  ctx.textAlign='left';
}

function drawGameOver(){
  const S=UI.scale;
  const fade=clamp((Game.deathT-0.4)/0.8,0,1);
  if(fade<=0) return;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.textAlign='center';
  // quiet first line
  ctx.fillStyle=rgba(COL.starlight,0.55);
  ctx.font=`500 ${clamp(VW*0.02,13,20)}px "IBM Plex Mono"`;
  ctx.fillText('SIGNAL LOST AT', VW/2, VH*0.30);
  // massive distance
  ctx.save();
  ctx.shadowColor=rgba(COL.cyan,0.8); ctx.shadowBlur=36*S;
  ctx.fillStyle=COL.starlight;
  const big=clamp(VW*0.09,44,110);
  ctx.font=`800 ${big}px "Unbounded"`;
  ctx.fillText(fmt(Game.distance)+' KM', VW/2, VH*0.30+big*0.9);
  ctx.restore();

  // NEW RECORD
  if(Game.newRecord){
    const p=0.6+0.4*Math.sin(Game.deathT*6);
    ctx.fillStyle=rgba(COL.gold,p);
    ctx.font=`700 ${clamp(VW*0.022,15,24)}px "Space Grotesk"`;
    ctx.save(); ctx.shadowColor=rgba(COL.gold,p); ctx.shadowBlur=24*S;
    ctx.fillText('★ NEW RECORD ★', VW/2, VH*0.30+big*0.9+34*S);
    ctx.restore();
  }

  // data readout
  const rows=[
    ['DISTANCE', fmt(Game.distance)+' KM'],
    ['SHARDS', fmt(Game.shards)],
    ['BEST COMBO', '×'+Game.bestCombo],
    ['PERIHELIONS', fmt(Game.perihelions)],
    ['SCORE', fmt(Game.score)],
  ];
  const rw=clamp(VW*0.36,300,440);
  const rx=VW/2-rw/2;
  let ry=VH*0.53;
  const rh=30*S;
  glassPanel(rx-18*S, ry-24*S, rw+36*S, rh*rows.length+30*S, 16*S);
  ctx.textAlign='left';
  for(const [k,v] of rows){
    ctx.fillStyle=rgba(COL.starlight,0.5);
    ctx.font=`400 ${clamp(VW*0.015,11,14)}px "IBM Plex Mono"`;
    ctx.fillText(k, rx, ry);
    ctx.textAlign='right';
    ctx.fillStyle= k==='SCORE'?COL.gold:COL.starlight;
    ctx.font=`600 ${clamp(VW*0.018,13,17)}px "Space Grotesk"`;
    ctx.fillText(v, rx+rw, ry);
    ctx.textAlign='left';
    ry+=rh;
  }
  // restart prompt
  const pa=0.5+0.5*Math.sin(Game.deathT*4);
  ctx.textAlign='center';
  ctx.fillStyle=rgba(COL.cyan,0.6+0.4*pa);
  ctx.font=`500 ${clamp(VW*0.016,12,16)}px "IBM Plex Mono"`;
  ctx.save(); ctx.shadowColor=rgba(COL.cyan,pa*0.7); ctx.shadowBlur=14*S;
  ctx.fillText('PRESS R TO RE-ESTABLISH UPLINK', VW/2, ry+30*S);
  ctx.restore();
  ctx.textAlign='left';
  ctx.restore();
}

let paused=false;
function drawPause(){
  ctx.fillStyle='rgba(7,9,20,0.6)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.fillStyle=COL.starlight;
  ctx.font=`700 ${clamp(VW*0.05,30,64)}px "Unbounded"`;
  ctx.save(); ctx.shadowColor=rgba(COL.cyan,0.6); ctx.shadowBlur=24; ctx.fillText('PAUSED', VW/2, VH*0.46); ctx.restore();
  ctx.fillStyle=rgba(COL.starlight,0.6);
  ctx.font=`500 ${clamp(VW*0.016,12,16)}px "IBM Plex Mono"`;
  ctx.fillText('PRESS P TO RESUME', VW/2, VH*0.54);
  ctx.textAlign='left';
}

function drawMuteIndicator(){
  const S=UI.scale;
  if(Audio.muted){
    ctx.fillStyle=rgba(COL.coral,0.7);
    ctx.font=`500 ${11*S}px "IBM Plex Mono"`;
    ctx.textAlign='center';
    ctx.fillText('🔇 MUTED', VW/2, VH-16*S);
    ctx.textAlign='left';
  }
}

/* =========================================================================
   INPUT
   ========================================================================= */
let pointerX=VW/2, pointerY=VH/2, pointerDown=false;
function screenToWorldAim(sx,sy){
  // account for zoom around screen center
  const z=cam.zoom;
  let x=sx, y=sy;
  if(z!==1){ x=(sx-VW/2)/z+VW/2; y=(sy-VH/2)/z+VH/2; }
  probe.aimX=cam.x+x; probe.aimY=cam.y+y;
}
function beginBurn(){
  Audio.unlock();
  if(Game.state==='TITLE'){ Game.startRun(); return; }
  if(Game.state==='DEAD'){ if(Game.deathT>0.5) Game.startRun(); return; }
  if(paused) return;
  probe.thrusting=true;
}
function endBurn(){ probe.thrusting=false; }

canvas.addEventListener('mousedown', e=>{ pointerDown=true; pointerX=e.clientX; pointerY=e.clientY; screenToWorldAim(pointerX,pointerY); beginBurn(); });
window.addEventListener('mouseup', e=>{ pointerDown=false; endBurn(); });
canvas.addEventListener('mousemove', e=>{ pointerX=e.clientX; pointerY=e.clientY; screenToWorldAim(pointerX,pointerY); });
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const tt=e.changedTouches[0]; pointerX=tt.clientX; pointerY=tt.clientY; screenToWorldAim(pointerX,pointerY); pointerDown=true; beginBurn(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const tt=e.changedTouches[0]; pointerX=tt.clientX; pointerY=tt.clientY; screenToWorldAim(pointerX,pointerY); }, {passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); pointerDown=false; endBurn(); }, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

window.addEventListener('keydown', e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!e.repeat){
      Audio.unlock();
      if(Game.state==='TITLE'){ Game.startRun(); }
      else if(Game.state==='DEAD'){ if(Game.deathT>0.5) Game.startRun(); }
      else if(!paused){ probe.thrusting=true; }
    }
  } else if(e.code==='KeyR'){
    if(Game.state==='DEAD' && Game.deathT>0.5) Game.startRun();
    else if(Game.state==='PLAYING') Game.startRun();
  } else if(e.code==='KeyM'){
    Store.muted=!Store.muted; Audio.setMute(Store.muted); Store.save();
  } else if(e.code==='KeyP'){
    if(Game.state==='PLAYING'){ paused=!paused; if(paused) probe.thrusting=false; }
  } else if(e.code==='Enter'){
    Audio.unlock();
    if(Game.state==='TITLE') Game.startRun();
    else if(Game.state==='DEAD' && Game.deathT>0.5) Game.startRun();
  }
});
window.addEventListener('keyup', e=>{
  if(e.code==='Space'){ e.preventDefault(); probe.thrusting=false; }
});
window.addEventListener('blur', ()=>{ probe.thrusting=false; pointerDown=false; });

/* keep thrusting while pointer held & aim tracks pointer during play */
function updateAim(){
  if(pointerDown && Game.state==='PLAYING' && !paused){
    screenToWorldAim(pointerX,pointerY);
    probe.thrusting=true;
  }
}

/* =========================================================================
   MAIN LOOP — fixed timestep 120Hz + interpolation
   ========================================================================= */
const FIXED = 1/120;
let accumulator=0, lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT) lastT=now;
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.1) dt=0.1; // clamp big pauses

  updateAim();

  // slow-mo scaling for the sim
  let simScale=1;
  if(Game.state==='DEAD' && Game.slowmo>0) simScale=0.25;
  if(paused) simScale=0;

  accumulator += dt*simScale;
  let steps=0;
  while(accumulator>=FIXED && steps<8){
    Game.fixedStep(FIXED);
    accumulator-=FIXED; steps++;
  }
  // visual-rate updates (particles, camera, counters) use real dt (scaled)
  Particles.update(dt*simScale + (Game.state!=='DEAD'?0:0));
  Game.updateVisual(dt* (Game.state==='DEAD'?1:1));

  render(accumulator/FIXED);
  if(paused) drawPause();
}

/* =========================================================================
   BOOT
   ========================================================================= */
function boot(){
  resize();
  initGrain();
  BG.init();
  Audio.setMute(Store.muted);
  // seed a title world
  world.reset((Math.random()*1e9)|0);
  cam.x=-VW*0.3; cam.y=-VH*0.2;
  Game.state='TITLE';
  requestAnimationFrame(frame);
}

// Wait for fonts (best-effort) then hide loader
function hideLoader(){ const l=document.getElementById('loader'); if(l) l.classList.add('hidden'); setTimeout(()=>l&&l.remove(),700); }
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ hideLoader(); });
  setTimeout(hideLoader, 2500); // fallback
} else { setTimeout(hideLoader, 800); }

boot();
</script>
